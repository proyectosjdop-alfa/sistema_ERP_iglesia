<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iglesia ERP - Gestión Ministerial</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              900: '#14532d',
            },
            darkbg: '#0f172a',
            darkcard: '#1e293b',
            darkborder: '#334155'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-darkcard border-r border-darkborder flex flex-col justify-between shrink-0">
    <div>
      <div class="p-5 border-b border-darkborder flex items-center gap-3">
        <div class="bg-brand-600 p-2 rounded-lg text-white">
          <i class="fa-solid fa-church text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none">Iglesia ERP</h1>
          <span class="text-xs text-slate-400">Panel de Control</span>
        </div>
      </div>
      
      <nav class="p-4 space-y-1 overflow-y-auto max-h-[calc(100vh-140px)]">
        <button onclick="switchTab('dashboard')" class="nav-btn active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition hover:bg-slate-800">
          <i class="fa-solid fa-chart-pie w-5 text-brand-500"></i> Dashboard
        </button>
        <button onclick="switchTab('miembros')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:bg-slate-800 hover:text-slate-200">
          <i class="fa-solid fa-users w-5"></i> Miembros y Visitantes
        </button>
        <button onclick="switchTab('finanzas')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:bg-slate-800 hover:text-slate-200">
          <i class="fa-solid fa-hand-holding-dollar w-5"></i> Finanzas y Diezmos
        </button>
        <button onclick="switchTab('config')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:bg-slate-800 hover:text-slate-200">
          <i class="fa-solid fa-sliders w-5"></i> Configuración
        </button>
      </nav>
    </div>

    <div class="p-4 border-t border-darkborder">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs">PA</div>
        <div>
          <p class="text-sm font-medium leading-none">Pastor Admin</p>
          <span class="text-xs text-slate-400">Rol: Administrador</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-y-auto bg-darkbg">
    
    <!-- Top Header -->
    <header class="h-16 border-b border-darkborder px-6 flex items-center justify-between bg-darkcard/50 backdrop-blur sticky top-0 z-10">
      <h2 id="page-title" class="text-xl font-bold">Dashboard General</h2>
      <div class="flex items-center gap-3">
        <button onclick="exportarBackup()" class="px-3 py-1.5 bg-slate-800 border border-darkborder rounded-lg text-xs font-medium hover:bg-slate-700 transition flex items-center gap-2">
          <i class="fa-solid fa-download"></i> Respaldar Datos
        </button>
      </div>
    </header>

    <!-- Content Sections -->
    <div class="p-6 space-y-6">

      <!-- SECTION: DASHBOARD -->
      <section id="sec-dashboard" class="tab-content space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-darkcard p-5 rounded-xl border border-darkborder">
            <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Miembros</p>
            <h3 id="dash-total-miembros" class="text-2xl font-bold mt-1">0</h3>
          </div>
          <div class="bg-darkcard p-5 rounded-xl border border-darkborder">
            <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Visitantes Nuevos</p>
            <h3 id="dash-total-visitantes" class="text-2xl font-bold mt-1">0</h3>
          </div>
          <div class="bg-darkcard p-5 rounded-xl border border-darkborder">
            <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Ingresos del Mes</p>
            <h3 id="dash-total-ingresos" class="text-2xl font-bold mt-1">$0.00</h3>
          </div>
        </div>

        <div class="bg-darkcard rounded-xl border border-darkborder p-5">
          <h3 class="font-bold mb-4">Actividad Reciente</h3>
          <ul id="lista-actividad" class="divide-y divide-darkborder text-sm text-slate-300">
            <!-- Dinámico -->
          </ul>
        </div>
      </section>

      <!-- SECTION: MIEMBROS -->
      <section id="sec-miembros" class="tab-content hidden space-y-4">
        <div class="bg-darkcard rounded-xl border border-darkborder overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase border-b border-darkborder">
              <tr>
                <th class="p-4">Nombre</th>
                <th class="p-4">Teléfono</th>
                <th class="p-4">Clasificación</th>
                <th class="p-4">Estado Espiritual</th>
              </tr>
            </thead>
            <tbody id="tabla-miembros" class="divide-y divide-darkborder text-sm">
              <!-- Dinámico -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- SECTION: FINANZAS -->
      <section id="sec-finanzas" class="tab-content hidden space-y-4">
        <div class="bg-darkcard rounded-xl border border-darkborder overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase border-b border-darkborder">
              <tr>
                <th class="p-4">Fecha</th>
                <th class="p-4">Tipo</th>
                <th class="p-4">Categoría</th>
                <th class="p-4">Descripción</th>
                <th class="p-4 text-right">Monto</th>
              </tr>
            </thead>
            <tbody id="tabla-finanzas" class="divide-y divide-darkborder text-sm">
              <!-- Dinámico -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- SECTION: CONFIGURACION -->
      <section id="sec-config" class="tab-content hidden space-y-4">
        <div class="bg-darkcard p-6 rounded-xl border border-darkborder space-y-4 max-w-xl">
          <h3 class="font-bold text-lg">Ajustes de la Iglesia</h3>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nombre de la Congregación</label>
            <input type="text" id="cfg-nombre" class="w-full bg-slate-900 border border-darkborder rounded-lg p-2.5 text-sm">
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- LÓGICA JAVASCRIPT EMBEBIDA -->
  <script>
    // --- DB & STORAGE ---
    const DB_KEY = "IGLESIA_ERP_DATA";

    const defaultData = {
      config: { nombreIglesia: "Iglesia Central", moneda: "$" },
      miembros: [
        { id: 1, nombre: "Juan Pérez", telefono: "+504 9900-0000", tipo: "Miembro", estado: "Líder" },
        { id: 2, nombre: "María López", telefono: "+504 8811-2233", tipo: "Visitante", estado: "Nuevo" }
      ],
      finanzas: [
        { id: 1, fecha: "2026-08-20", tipo: "ingreso", categoria: "Diezmo", descripcion: "Aporte semanal", monto: 150.00 },
        { id: 2, fecha: "2026-08-22", tipo: "egreso", categoria: "Servicios", descripcion: "Pago de electricidad", monto: 45.00 }
      ],
      actividades: [
        "Sistema iniciado correctamente."
      ]
    };

    function getDB() {
      const data = localStorage.getItem(DB_KEY);
      return data ? JSON.parse(data) : defaultData;
    }

    // --- APLICACIÓN ---
    document.addEventListener("DOMContentLoaded", () => {
      renderDashboard();
      renderMiembros();
      renderFinanzas();
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));

      const selectedSec = document.getElementById(`sec-${tabId}`);
      if(selectedSec) selectedSec.classList.remove('hidden');

      const pageTitle = document.getElementById('page-title');
      pageTitle.innerText = tabId.charAt(0).toUpperCase() + tabId.slice(1);
    }

    function renderDashboard() {
      const db = getDB();
      document.getElementById('dash-total-miembros').innerText = db.miembros.filter(m => m.tipo === 'Miembro').length;
      document.getElementById('dash-total-visitantes').innerText = db.miembros.filter(m => m.tipo === 'Visitante').length;
      
      const totalIngresos = db.finanzas
        .filter(f => f.tipo === 'ingreso')
        .reduce((acc, curr) => acc + Number(curr.monto), 0);
      
      document.getElementById('dash-total-ingresos').innerText = `${db.config.moneda} ${totalIngresos.toFixed(2)}`;

      const lista = document.getElementById('lista-actividad');
      lista.innerHTML = db.actividades.map(act => `<li class="py-2 flex items-center gap-2"><i class="fa-solid fa-circle-info text-xs text-brand-500"></i> ${act}</li>`).join('');
    }

    function renderMiembros() {
      const db = getDB();
      const tabla = document.getElementById('tabla-miembros');
      
      tabla.innerHTML = db.miembros.map(m => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-4 font-medium">${m.nombre}</td>
          <td class="p-4 text-slate-400">${m.telefono}</td>
          <td class="p-4"><span class="px-2 py-1 rounded text-xs ${m.tipo === 'Miembro' ? 'bg-emerald-900/50 text-emerald-300' : 'bg-amber-900/50 text-amber-300'}">${m.tipo}</span></td>
          <td class="p-4 text-slate-300">${m.estado}</td>
        </tr>
      `).join('');
    }

    function renderFinanzas() {
      const db = getDB();
      const tabla = document.getElementById('tabla-finanzas');
      
      tabla.innerHTML = db.finanzas.map(f => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="p-4 text-slate-400">${f.fecha}</td>
          <td class="p-4"><span class="uppercase font-bold text-xs ${f.tipo === 'ingreso' ? 'text-brand-500' : 'text-rose-500'}">${f.tipo}</span></td>
          <td class="p-4 font-medium">${f.categoria}</td>
          <td class="p-4 text-slate-400">${f.descripcion}</td>
          <td class="p-4 text-right font-bold ${f.tipo === 'ingreso' ? 'text-brand-500' : 'text-rose-400'}">
            ${f.tipo === 'ingreso' ? '+' : '-'}${db.config.moneda} ${Number(f.monto).toFixed(2)}
          </td>
        </tr>
      `).join('');
    }

    function exportarBackup() {
      const db = getDB();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `iglesia_erp_backup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
